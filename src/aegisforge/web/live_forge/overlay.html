<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Forge · Overlay</title>
<style>:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,sans-serif;color:#eef3ff;background:transparent}body{margin:0;padding:12px;background:transparent}#wrap{background:rgba(14,28,47,.91);border:2px solid #65c6bc;border-radius:16px;padding:18px;max-width:720px;box-sizing:border-box;overflow:hidden}#wrap[data-theme="violet"]{border-color:#b69afa;background:rgba(35,24,59,.94)}#wrap[data-theme="amber"]{border-color:#ffc777;background:rgba(52,39,26,.94)}#wrap[data-theme="blue"]{border-color:#89beee;background:rgba(20,39,60,.94)}#timerBar{height:9px;border-radius:6px;background:#354d65;margin-top:12px;overflow:hidden}#timerFill{height:100%;width:100%;background:#72cbbb;transition:width .7s linear}#wrap[data-theme="violet"] #timerFill{background:#b69afa}#wrap[data-theme="amber"] #timerFill{background:#ffc777}#wrap[data-theme="blue"] #timerFill{background:#89beee}#remaining{display:block;margin-top:8px}small{color:#a9c7e5}h2{margin:.4rem 0}p{margin:0;font-size:1.1rem}.hidden{display:none}</style></head><body><div id="wrap" class="hidden"><small id="scope">LIVE FORGE · MOD COMUNITARIO</small><h2 id="title"></h2><p id="message"></p><small id="components"></small><div id="timerBar" role="progressbar" aria-label="Tiempo restante del efecto" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="timerFill"></div></div><small id="remaining"></small></div><script src="/overlay.js" defer></script></body></html>
